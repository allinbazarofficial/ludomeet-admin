<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join my LudoMeet game</title>
<meta property="og:title" content="Play Ludo with me on LudoMeet">
<meta property="og:description" content="Tap to join my game room.">
<meta property="og:image" content="https://playludomeet.com/store/icon_512.png">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1b1240;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;text-align:center}
  .card{padding:32px 24px;max-width:360px}
  img{width:110px;height:110px;border-radius:26px}
  h1{font-size:24px;margin:18px 0 6px}
  p{opacity:.8;margin:0 0 22px;line-height:1.45}
  .code{font-size:30px;letter-spacing:6px;font-weight:800;color:#f5b301;margin-bottom:22px}
  a.btn{display:block;padding:15px;border-radius:14px;font-weight:700;text-decoration:none;margin:10px 0}
  .open{background:#f5b301;color:#1b1240}.get{background:#2d2163;color:#fff}
</style>
</head>
<body>
<div class="card">
  <img src="/store/icon_512.png" alt="LudoMeet">
  <h1>Join my Ludo game</h1>
  <p>Open LudoMeet and enter the room. Don't have the app yet? Get it free on Google Play.</p>
  <div class="code" id="code"></div>
  <a class="btn open" id="open" href="#">Open in LudoMeet</a>
  <a class="btn get" href="https://play.google.com/store/apps/details?id=com.ludomeet.app">Get LudoMeet on Google Play</a>
</div>
<script>
  var c = (new URLSearchParams(location.search).get('c') || '').replace(/\D/g, '').slice(0, 6);
  document.getElementById('code').textContent = c ? 'Room ' + c : '';
  var store = 'https://play.google.com/store/apps/details?id=com.ludomeet.app';
  var intent = 'intent://join?c=' + c + '#Intent;scheme=ludomeet;package=com.ludomeet.app;S.browser_fallback_url=' + encodeURIComponent(store) + ';end';
  var link = /Android/i.test(navigator.userAgent) ? intent : store;
  document.getElementById('open').href = link;
  if (c && /Android/i.test(navigator.userAgent)) setTimeout(function () { location.href = intent; }, 300);
</script>
</body>
</html>
