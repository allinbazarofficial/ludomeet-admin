<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>LudoMeet — সার্ভার চালু করুন</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1b1240;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:#fff}
  .card{background:#2d2163;border-radius:22px;padding:28px;max-width:420px;width:90%;text-align:center}
  h1{font-size:22px;margin:0 0 8px}
  p{opacity:.85;line-height:1.5;margin:6px 0 18px}
  label.pick{display:block;background:#f5b301;color:#1b1240;font-weight:800;padding:16px;border-radius:14px;cursor:pointer;font-size:17px}
  input{display:none}
  #msg{margin-top:18px;font-size:17px;font-weight:700;min-height:24px}
  .ok{color:#49e37a}.err{color:#ff6b6b}
</style>
</head>
<body>
<div class="card">
  <h1>🎲 গেম সার্ভার চালু করুন</h1>
  <p>Firebase থেকে ডাউনলোড করা <b>.json</b> চাবি ফাইলটা নিচের বাটনে চেপে বেছে দিন। ফাইলটা সরাসরি আপনার সার্ভারে যাবে।</p>
  <label class="pick">📁 চাবি ফাইল বেছে নিন<input type="file" id="f" accept=".json,application/json"></label>
  <div id="msg"></div>
</div>
<script>
  const msg = document.getElementById('msg');
  document.getElementById('f').onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    msg.className = ''; msg.textContent = 'আপলোড হচ্ছে…';
    try {
      const text = await file.text();
      const r = await fetch('/game/setup-key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: text });
      const j = await r.json().catch(() => ({}));
      if (j.ok) {
        msg.className = 'ok'; msg.textContent = 'সার্ভার চালু হচ্ছে… ';
        await new Promise(r => setTimeout(r, 6000));
        const h = await fetch('/game/health').then(r => r.json()).catch(() => ({}));
        msg.textContent = h.ok ? '✅ হয়ে গেছে! গেম সার্ভার চালু। এখন ডাউনলোড করা ফাইলটা কম্পিউটার থেকে মুছে দিন।' : '✅ ফাইল বসানো হয়েছে। এক মিনিট পরে অ্যাপে অনলাইন লুডু চালু হবে। ডাউনলোড করা ফাইলটা মুছে দিন।';
      } else {
        msg.className = 'err';
        msg.textContent = j.error === 'A key is already installed.' ? 'চাবি আগেই বসানো আছে ✅ আর কিছু করতে হবে না।'
          : j.error ? '❌ এটা সঠিক ফাইল নয়। Firebase থেকে ডাউনলোড করা LudoMeet-এর .json ফাইলটা দিন।'
          : '❌ সার্ভারে পৌঁছানো যায়নি। একটু পরে আবার চেষ্টা করুন।';
      }
    } catch (err) { msg.className = 'err'; msg.textContent = '❌ ফাইল পড়া যায়নি।'; }
  };
</script>
</body>
</html>
