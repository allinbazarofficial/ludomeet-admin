*{box-sizing:border-box}body{margin:0;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--mint);border-bottom:1px solid var(--mint2);display:flex;align-items:center;gap:14px;padding:14px 22px}
.top .ham{border:0;background:none;font-size:24px;color:var(--ink)}
.top .kick{font-size:12px;letter-spacing:.25em;color:var(--accent);font-weight:700}
.top h1{margin:2px 0 0;font-size:26px;font-weight:600}
.top .sp{flex:1}.pill{background:#cdebdc;color:#1d6b4c;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.08em}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;color:var(--ink)}
.btn.o{background:var(--accent);border-color:var(--accent);color:#fff}.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.drawer{position:fixed;inset:0 auto 0 0;width:270px;background:#fff;box-shadow:4px 0 24px #0002;transform:translateX(-105%);transition:.2s;z-index:20;overflow:auto;padding:16px}
.drawer.open{transform:none}.shade{position:fixed;inset:0;background:#0003;z-index:15;display:none}.shade.open{display:block}
#app{transition:padding-left .2s}
@media(min-width:900px){body.side #app{padding-left:270px}body.side .drawer{transform:none;box-shadow:none;border-right:1px solid var(--line);z-index:6}body.side .shade{display:none!important}}
.ut td{white-space:nowrap}.ut .nm{display:flex;align-items:center;gap:10px}.ut .nm b{display:block;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.ut .sub{font-size:12px;color:var(--muted)}.gd{display:inline-block;min-width:26px;text-align:center;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:#e8efff;color:#3b6fe0}.gd.f{background:#ffe6f0;color:#c2397a}
.vipid{display:inline-block;font-weight:800;padding:2px 9px;border-radius:8px;color:#3a1a00;background:linear-gradient(90deg,#ffd76a,#ff9a3d,#ffd76a);background-size:200% 100%;animation:vipsh 2.5s linear infinite;letter-spacing:.06em}
@keyframes vipsh{to{background-position:-200% 0}}
.ic{border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px}
.chip .n{font-size:11px;opacity:.75;margin-left:4px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}.brand img{width:44px;height:44px;border-radius:12px}.brand small{display:block;color:var(--accent);font-size:11px;letter-spacing:.2em;font-weight:700}.brand b{font-size:18px}
.drawer input{width:100%;padding:9px 14px;border:1px solid var(--mint2);background:#f6fbf9;border-radius:12px;margin-bottom:10px}
.sec{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:16px 6px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:12px;color:#3b4a52;font-size:15px}
.nav:hover{background:#f5f1ec}.nav.act{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 12px #ff7a4555}
.nav .tag{margin-left:auto;font-size:10px;background:#fff1ea;color:var(--accent);padding:2px 6px;border-radius:6px}
main{max-width:1180px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid #f0e6de;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0000000a}
.ttl{font-size:13px;letter-spacing:.2em;color:var(--blue);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.ttl:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.stat{border:1px solid #efe5dc;border-radius:16px;padding:14px 16px;background:#fffdfb}
.stat.hl{background:var(--mint);border-color:#bfe3d2}
.stat span{font-size:13px;color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:6px;color:#7a2e12;font-weight:600}
.stat.hl b{color:#1d6b4c}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #cfe9dc;background:#f2fbf6;border-radius:999px;padding:8px 16px}.chip.act{background:var(--accent);border-color:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #f1e8e0;vertical-align:middle}th{color:var(--muted);font-weight:600;font-size:12px}
.tw{overflow:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:200px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#eee}.badge.pending{background:#fff1d6;color:#a15c00}.badge.paid{background:#d9f5e7;color:#1d6b4c}.badge.rejected{background:#fde0e0;color:#b02a2a}.badge.ban{background:#fde0e0;color:#b02a2a}.badge.seller{background:#e3ecff;color:#2848a8}.badge.vip{background:linear-gradient(90deg,#ffc94d,#ff8a3d);color:#3a1a00}.badge.lv{background:linear-gradient(90deg,#5ccb9a,#1873d3);color:#fff}.badge.role{background:#efe6ff;color:#5a2bb0}
.muted{color:var(--muted)}.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eee;vertical-align:middle}
.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(420px,92vw);text-align:center;padding:34px}
.login img{width:84px;height:84px;border-radius:20px}.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 22px;font-weight:600;margin-top:18px}
.dlg{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:9999}.dbox{background:#fff;border-radius:20px;padding:22px;max-width:420px;width:90%;box-shadow:0 10px 40px #0004}.dmsg{font-size:16px;line-height:1.5;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:#0005;display:none;place-items:center;z-index:30}.modal.open{display:grid}
.modal .card{width:min(520px,94vw);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24323a;color:#fff;padding:12px 20px;border-radius:14px;display:none;z-index:40}
.empty{padding:30px;text-align:center;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;margin-right:8px}.lang b{padding:7px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--muted)}.lang b.on{background:var(--accent);color:#fff}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
</style>
</head>

 if(n.nodeType===3){if(!/[ঀ-৿]/.test(n.nodeValue)&&!ORIG.has(n))return;if(!ORIG.has(n))ORIG.set(n,n.nodeValue);const o=ORIG.get(n);const v=LANG==="en"?T(o):o;if(n.nodeValue!==v){SETV.set(n,v);n.nodeValue=v}return}
 if(n.nodeType!==1||n.tagName==="SCRIPT"||n.tagName==="STYLE"||n.tagName==="TEXTAREA")return;
 if(n.hasAttribute("placeholder")){if(!n.dataset.ph)n.dataset.ph=n.getAttribute("placeholder");const v=LANG==="en"?T(n.dataset.ph):n.dataset.ph;if(n.getAttribute("placeholder")!==v)n.setAttribute("placeholder",v)}
 n.childNodes.forEach(trNode);
}

const bindDur=()=>{let m=3;document.querySelectorAll("#dur .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#dur .chip").forEach(c=>c.classList.remove("act"));b.classList.add("act");m=+b.dataset.m});return()=>m};
function vipGive(v){
 modal(`<h3 style="margin-top:0">VIP আইডি ${v} দিন</h3><label class="f">ইউজারের আইডি বা Gmail</label><input class="inp" id="vq" style="width:100%">${durPick()}
 <div class="row" style="margin-top:16px"><button class="btn o" id="vok">দিন</button><button class="btn" id="mclose">বন্ধ</button></div>`);
 $("#mclose").onclick=closeM;const getM=bindDur();
 $("#vok").onclick=async()=>{const q=$("#vq").value.trim();if(!q){toast("ইউজারের আইডি বা Gmail");return}
  try{const hits=await findUsers(q);if(hits.length!==1){toast("কোনো ইউজার পাওয়া যায়নি");return}
   const d=hits[0],u=d.data(),m=getM();
   const cur=await getDoc(doc(db,"ids",v));const cx=cur.data()||{};
   if(cx.uid&&cx.uid!==d.id){const o=await getDoc(doc(db,"users",cx.uid));if(o.exists()&&o.data().vipId===v&&vipOn(o.data())){toast("এই VIP আইডি এখন অন্য কেউ ব্যবহার করছে");return}}
   const until=addMonths(new Date(),m);
   if(!await dlg(`${u.name} (আসল ${ownId(u)}) কে ${v} দেবেন? মেয়াদ: ${day(until)}`))return;
   const b=writeBatch(db);
   if(vipOn(u)&&u.vipId!==v)b.set(doc(db,"ids",u.vipId),{type:"vip",uid:null,until:null},{merge:true});
   if(cx.uid&&cx.uid!==d.id){b.update(doc(db,"users",cx.uid),{vipId:"",vipUntil:null});syncProfile(b,cx.uid,{vipId:"",vipUntil:null})}
   syncProfile(b,d.id,{vipId:v,vipUntil:Timestamp.fromDate(until)});
   b.set(doc(db,"ids",v),{type:"vip",uid:d.id,until:Timestamp.fromDate(until),at:serverTimestamp()},{merge:true});
   b.update(doc(db,"users",d.id),{vipId:v,vipUntil:Timestamp.fromDate(until),updatedAt:serverTimestamp()});
   await b.commit();await log("vip-give",v,{to:ownId(u),name:u.name,months:m});toast("হয়ে গেছে ✓");closeM();vip();
  }catch(e){toast("ব্যর্থ: "+e.message)}};
}
function vipExtend(o){
 modal(`<h3 style="margin-top:0">${o.v} — মেয়াদ বাড়ান</h3><div class="muted">${esc(o.u.name)} · এখন শেষ হবে ${day(o.u.vipUntil)}</div>${durPick()}
 <div class="row" style="margin-top:16px"><button class="btn g" id="vok">বাড়ান</button><button class="btn" id="mclose">বন্ধ</button></div>`);
 $("#mclose").onclick=closeM;const getM=bindDur();
 $("#vok").onclick=async()=>{const m=getM();const base=Math.max(Date.now(),o.u.vipUntil.toMillis());const until=addMonths(new Date(base),m);
  try{const b=writeBatch(db);b.update(doc(db,"users",o.x.uid),{vipUntil:Timestamp.fromDate(until)});syncProfile(b,o.x.uid,{vipUntil:Timestamp.fromDate(until)});b.set(doc(db,"ids",o.v),{until:Timestamp.fromDate(until)},{merge:true});await b.commit();
   await log("vip-extend",o.v,{name:o.u.name,months:m});toast("হয়ে গেছে ✓");closeM();vip()}catch(e){toast("ব্যর্থ: "+e.message)}};
}
async function vipRevoke(o){
 if(!await dlg(`${o.v} ${o.u.name}-এর কাছ থেকে ফিরিয়ে নেবেন? তার আসল আইডি ${ownId(o.u)} আবার দেখাবে।`))return;
 try{const b=writeBatch(db);b.update(doc(db,"users",o.x.uid),{vipId:"",vipUntil:null});syncProfile(b,o.x.uid,{vipId:"",vipUntil:null});b.set(doc(db,"ids",o.v),{uid:null,until:null},{merge:true});await b.commit();
  await log("vip-revoke",o.v,{name:o.u.name});toast("হয়ে গেছে ✓");vip()}catch(e){toast("ব্যর্থ: "+e.message)}
}

function lightbox(src){modal(`<img src="${src}" style="width:100%;border-radius:14px"><div class="row" style="margin-top:10px;justify-content:flex-end"><button class="btn" id="mclose">বন্ধ</button></div>`);$("#mclose").onclick=closeM}
async function userProfile(uid){
 view(`<div class="card empty">লোড হচ্ছে…</div>`);$("#ptitle").textContent="ইউজার প্রোফাইল";
 try{
  const [us,ps,fo,fi]=await Promise.all([getDoc(doc(db,"users",uid)),getDoc(doc(db,"profiles",uid)),
   getCountFromServer(collection(db,"users",uid,"followers")).catch(()=>null),getCountFromServer(collection(db,"users",uid,"following")).catch(()=>null)]);
  const u=us.data()||{};cache[uid]=u;const ids=u.photos||[];
  const photos=await Promise.all(ids.map(id=>getDoc(doc(db,"profiles",uid,"photos",id)).then(d=>({id,data:d.data()?.data||"",thumb:d.data()?.thumb||""})).catch(()=>({id,data:"",thumb:""}))));
  let hist=[];try{hist=(await getDocs(query(collection(db,"users",uid,"nameChanges"),orderBy("at","desc"),limit(30)))).docs.map(d=>d.data())}catch(e){}
  const bd=u.birthDate?.toDate?u.birthDate.toDate():null;const bdStr=bd?bd.toISOString().slice(0,10):"";
  const age=bd?Math.floor((Date.now()-bd.getTime())/31557600000):"—";
  view(`<div class="card"><div class="row" style="align-items:center">
   <img class="av" style="width:72px;height:72px" src="${u.photoData?"data:image/jpeg;base64,"+u.photoData:PRIVATE_LOGO}">
   <div style="flex:1"><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">ID ${esc(shownId(u))}${vipOn(u)?` · VIP (আসল ${esc(ownId(u))})`:""} · ${esc(u.email||"")}</div>
   <div style="margin-top:6px"><span class="badge lv">Lv ${lvl(u)}</span> ${(u.roles||[]).map(r=>`<span class="badge role">${esc((ROLES.find(x=>x[0]===r)||[r,r])[1])}</span>`).join(" ")} ${u.banned?'<span class="badge ban">BANNED</span>':""}</div></div>
   <button class="btn o" id="pmsg">💬 মেসেজ দেখুন</button> <button class="btn" id="back">← ফিরে যান</button></div>
   <div class="grid" style="margin-top:14px;grid-template-columns:repeat(4,1fr)">
    <div class="stat"><span>Followers</span><b>${fo?fmt(fo.data().count):"—"}</b></div><div class="stat"><span>Following</span><b>${fi?fmt(fi.data().count):"—"}</b></div>
    <div class="stat"><span>কয়েন</span><b>${fmt(u.coins)}</b></div><div class="stat"><span>ডায়মন্ড</span><b>${fmt(u.diamonds)}</b></div></div></div>
  <div class="card"><div class="row" style="align-items:center"><div class="ttl" style="flex:1">ছবি (${photos.length}/6)</div>${photos.length?'<button class="btn r sm" id="delall">সব ছবি মুছুন</button>':""}</div>
   ${photos.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px">${photos.map((p,i)=>`<div style="position:relative"><img data-big="${i}" src="data:image/jpeg;base64,${p.thumb||p.data}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in">${i===0?'<span class="badge" style="position:absolute;left:6px;top:6px;background:#ffc93c">Main</span>':""}<button class="btn r sm" data-delp="${p.id}" style="position:absolute;right:6px;top:6px">✕</button></div>`).join("")}</div>`:'<div class="muted" style="margin-top:8px">কোনো ছবি নেই (অ্যাপে লোগো দেখায়)</div>'}</div>
  <div class="card" style="max-width:640px"><div class="ttl">প্রোফাইলের তথ্য</div>
   <label class="f">নাম</label><div class="row"><input class="inp" id="pname" value="${esc(u.name)}" style="flex:1"><button class="btn r" id="warn">⚠ Warning নাম দিন</button></div>
   <label class="f">বায়ো</label><textarea class="inp" id="pbio" rows="3" style="width:100%">${esc(u.bio||"")}</textarea>
   <div class="row"><div style="flex:1"><label class="f">জন্মতারিখ (বয়স ${age})</label><input class="inp" id="pbd" type="date" value="${bdStr}" style="width:100%"></div>
   <div style="flex:1"><label class="f">লিঙ্গ</label><select class="inp" id="pg" style="width:100%"><option value="">—</option><option value="male" ${u.gender==="male"?"selected":""}>Male</option><option value="female" ${u.gender==="female"?"selected":""}>Female</option></select></div>
   <div style="flex:1"><label class="f">দেশ</label><input type="hidden" id="pc" value="${esc(u.country||"")}"><button class="inp" id="pcb" type="button" style="width:100%;text-align:left;cursor:pointer">${u.country?flag(u.country)+" "+esc(cname(u.country)):"— দেশ বাছাই করুন —"} ▾</button></div></div>
   <button class="btn o" id="psv" style="margin-top:14px">সেভ করুন</button></div>
  <div class="card"><div class="ttl">নাম বদলের ইতিহাস</div>${hist.length?`<table><tr><th>সময়</th><th>আগের নাম</th><th>নতুন নাম</th><th>ফি</th><th>কে</th></tr>${hist.map(h=>`<tr><td>${dt(h.at)}</td><td>${esc(h.from)}</td><td><b>${esc(h.to)}</b></td><td>${h.fee?fmt(h.fee)+" কয়েন":"ফ্রি"}</td><td>${h.by==="admin"?"অ্যাডমিন":"ইউজার"}</td></tr>`).join("")}</table>`:'<div class="muted">এখনো নাম বদল হয়নি</div>'}</div>`);
  $("#back").onclick=()=>go(current);
  $("#pmsg").onclick=()=>{current="chats";drawNav();$("#ptitle").textContent="মেসেজ";chats(shownId(u))};
  $("#pcb").onclick=()=>pickCountry($("#pc").value,c=>{$("#pc").value=c;$("#pcb").textContent=flag(c)+" "+cname(c)+" ▾"});
  document.querySelectorAll("[data-big]").forEach(im=>im.onclick=()=>{const p=photos[+im.dataset.big];lightbox("data:image/jpeg;base64,"+(p.data||p.thumb))});
  const savePhotos=async(keep,removed)=>{const b=writeBatch(db);let thumb=null;if(keep.length){const f=photos.find(p=>p.id===keep[0]);thumb=f?.thumb||null}
   const fields={photos:keep,photoData:thumb};b.update(doc(db,"users",uid),fields);syncProfile(b,uid,fields);removed.forEach(id=>b.delete(doc(db,"profiles",uid,"photos",id)));await b.commit()};
  document.querySelectorAll("[data-delp]").forEach(bt=>bt.onclick=async()=>{if(!await dlg("এই ছবিটা মুছবেন?"))return;const id=bt.dataset.delp;
   try{await savePhotos(ids.filter(x=>x!==id),[id]);await log("photo-remove",shownId(u),{name:u.name});toast("হয়ে গেছে ✓");userProfile(uid)}catch(e){toast("ব্যর্থ: "+e.message)}});
  if($("#delall"))$("#delall").onclick=async()=>{if(!await dlg("এই ইউজারের সব ছবি মুছবেন? লোগো তার প্রোফাইল ছবি হবে।"))return;
   try{await savePhotos([],ids);await log("photo-remove-all",shownId(u),{name:u.name,count:ids.length});toast("হয়ে গেছে ✓");userProfile(uid)}catch(e){toast("ব্যর্থ: "+e.message)}};
  const setName=async(name,warning)=>{const b=writeBatch(db);const f={name,nameChangedAt:serverTimestamp(),updatedAt:serverTimestamp()};b.update(doc(db,"users",uid),f);syncProfile(b,uid,{name});
   b.set(doc(collection(db,"users",uid,"nameChanges")),{from:u.name||"",to:name,fee:0,by:"admin",at:serverTimestamp()});

async function doTransfer(O,N,why){
 if(!why)return toast("যাচাইয়ের কারণ / নোট লিখুন");
 if(!await dlg(`নিশ্চিত? ${O.name} (ID ${shownId(O)}) এর পুরো অ্যাকাউন্ট ${N.email}-এ যাবে। নতুন অ্যাকাউন্ট (ID ${shownId(N)}) বাতিল হবে। এটা ফেরানো যাবে না।`))return;
 const box=$("#tfbox");box.insertAdjacentHTML("beforeend",`<div class="muted" id="tfp" style="margin-top:10px">সরানো হচ্ছে… পেজ বন্ধ করবেন না</div>`);
 const step=t=>{const e=$("#tfp");if(e)e.textContent=t};
 const o=O.id,n=N.id;
 try{
  // Small helper: run writes in batches of 400.
  const ops=[];const run=async()=>{for(let k=0;k<ops.length;k+=400){const b=writeBatch(db);ops.slice(k,k+400).forEach(f=>f(b));await b.commit()}ops.length=0};
  step("অ্যাকাউন্টের তথ্য সরানো হচ্ছে…");
  const ou=(await getDoc(doc(db,"users",o))).data()||{},op=(await getDoc(doc(db,"profiles",o))).data()||{};
  const nu=(await getDoc(doc(db,"users",n))).data()||{};
  const keep={email:nu.email||"",updatedAt:serverTimestamp(),transferredFrom:o,transferredAt:serverTimestamp()};
  ops.push(b=>b.set(doc(db,"users",n),{...ou,...keep}));
  ops.push(b=>b.set(doc(db,"profiles",n),{...op,updatedAt:serverTimestamp()}));
  if(ou.userId)ops.push(b=>b.set(doc(db,"ids",ou.userId),{type:"user",uid:n,at:serverTimestamp()},{merge:true}));
  if(nu.userId&&nu.userId!==ou.userId)ops.push(b=>b.delete(doc(db,"ids",nu.userId)));
  if(ou.vipId)ops.push(b=>b.set(doc(db,"ids",ou.vipId),{uid:n},{merge:true}));
  // Photos
  for(const pid of (ou.photos||[])){const ph=(await getDoc(doc(db,"profiles",o,"photos",pid))).data();if(ph){ops.push(b=>b.set(doc(db,"profiles",n,"photos",pid),ph));ops.push(b=>b.delete(doc(db,"profiles",o,"photos",pid)))}}
  await run();
  step("ফলোয়ার ও ফলোয়িং সরানো হচ্ছে…");
  // The new account's own lists are cancelled.
  for(const sub of ["followers","following","visitors","visited"]){const s=await getDocs(collection(db,"users",n,sub));s.docs.forEach(d=>ops.push(b=>b.delete(d.ref)))}
  await run();
  const moveList=async(sub,mirror)=>{const s=await getDocs(collection(db,"users",o,sub));
   for(const d of s.docs){const other=d.id;if(other===n)continue;
    ops.push(b=>b.set(doc(db,"users",n,sub,other),d.data()));ops.push(b=>b.delete(d.ref));
    ops.push(b=>b.delete(doc(db,"users",other,mirror,o)));ops.push(b=>b.set(doc(db,"users",other,mirror,n),d.data()))}};
  await moveList("followers","following");await moveList("following","followers");
  await moveList("visitors","visited");await moveList("visited","visitors");
  await run();
  step("কয়েন ও ডায়মন্ড হিস্টোরি সরানো হচ্ছে…");
  for(const sub of ["coinLog","diamondLog"]){
   const ns=await getDocs(collection(db,"users",n,sub));ns.docs.forEach(d=>ops.push(b=>b.delete(d.ref)));
   const s=await getDocs(collection(db,"users",o,sub));s.docs.forEach(d=>{ops.push(b=>b.set(doc(db,"users",n,sub,d.id),d.data()));ops.push(b=>b.delete(d.ref))})}
  await run();
  step("পুরোনো Gmail-এর অ্যাকাউন্ট মুছে ফেলা হচ্ছে…");
  ops.push(b=>b.delete(doc(db,"users",o)));ops.push(b=>b.delete(doc(db,"profiles",o)));
  ops.push(b=>b.set(doc(collection(db,"users",n,"inbox")),{title:"Your account is back",body:`Your old LudoMeet account (ID ${shownId(ou)}) was moved to this Gmail. Restart the app to see everything.`,kind:"system",at:serverTimestamp()}));
  ops.push(b=>b.set(doc(collection(db,"adminLogs")),{action:"account-transfer",target:shownId(ou),info:{fromUid:o,toUid:n,fromEmail:ou.email||"",toEmail:nu.email||"",cancelledId:nu.userId||"",why},by:auth.currentUser.email,at:serverTimestamp()}));
  await run();
  step("✅ হয়ে গেছে! নতুন Gmail দিয়ে অ্যাপ নতুন করে খুললে পুরোনো অ্যাকাউন্ট দেখাবে।");
  toast("অ্যাকাউন্ট ফেরত দেওয়া হয়েছে ✓");
 }catch(e){step("ব্যর্থ: "+e.message+" — আবার চেষ্টা করলে যেখানে থেমেছিল সেখান থেকে চলবে");toast("ব্যর্থ: "+e.message)}
}

// ---------- App error reports ----------
async function crashes(){
 view(`<div class="card"><div class="ttl">অ্যাপ এরর (ইউজারদের ফোন থেকে)</div><div class="muted">অ্যাপে কোনো ভুল হলে এখানে আসে, যাতে দ্রুত ঠিক করা যায়।</div><div class="tw" id="crl" style="margin-top:10px"><div class="empty">লোড হচ্ছে…</div></div></div>`);
 try{const s=await getDocs(query(collection(db,"crashes"),orderBy("at","desc"),limit(100)));
  $("#crl").innerHTML=s.size?`<table><tr><th>সময়</th><th>ইউজার</th><th>ভার্সন</th><th>এরর</th></tr>${s.docs.map(d=>{const c=d.data();return `<tr><td style="white-space:nowrap">${dts(c.at)}</td><td>${esc(c.userId||"—")}</td><td>${esc(c.version||"")}</td><td><b style="font-size:12px">${esc(c.error)}</b><pre style="white-space:pre-wrap;font-size:11px;max-height:120px;overflow:auto;margin:4px 0 0">${esc(c.stack||"")}</pre></td></tr>`}).join("")}</table>`:`<div class="empty">কোনো এরর নেই 🎉</div>`;
 }catch(e){$("#crl").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
function soon(){view(`<div class="card empty" style="padding:60px">🚧 এই সেকশন অনলাইন আপডেটের (ভয়েস রুম, গিফট, অনলাইন গেম) সাথে চালু হবে।</div>`)}
const PAGES={trading,botgames,dash,users,banned,payroll,sellers,packages,wallet,topup,logs,message,vip,roles,apps,deposits,depset,chats,reports,games,live,gifts,giftinc,transfer,crashes};

// ---------- Auth ----------
setPersistence(auth,browserLocalPersistence).catch(()=>{});
getRedirectResult(auth).catch(e=>{$("#lerr").textContent="লগইন হয়নি: "+e.code});
$("#gin").onclick=async()=>{$("#lerr").textContent="";try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){
 /* Phones often block pop-ups: go to Google's page instead. */
 if(["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported"].includes(e.code)){try{await signInWithRedirect(auth,new GoogleAuthProvider());return}catch(e2){e=e2}}
 if(e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")$("#lerr").textContent="লগইন হয়নি: "+e.code}};
const PWERR={"auth/invalid-credential":"Gmail বা পাসওয়ার্ড ভুল","auth/wrong-password":"পাসওয়ার্ড ভুল","auth/user-not-found":"এই Gmail-এ পাসওয়ার্ড সেট করা নেই","auth/too-many-requests":"অনেকবার ভুল হয়েছে — কিছুক্ষণ পর চেষ্টা করুন","auth/operation-not-allowed":"পাসওয়ার্ড লগইন এখনো চালু হয়নি","auth/invalid-email":"Gmail ঠিক নয়"};
$("#lpwv").onclick=()=>{const i=$("#lpw");i.type=i.type==="password"?"text":"password"};
$("#pwform").onsubmit=async e=>{e.preventDefault();$("#lerr").textContent="";const em=$("#lem").value.trim().toLowerCase(),pw=$("#lpw").value;
 if(!ADMINS.includes(em))return $("#lerr").textContent="এই Gmail অ্যাডমিন না";if(!pw)return $("#lerr").textContent="পাসওয়ার্ড দিন";
 try{await signInWithEmailAndPassword(auth,em,pw)}catch(e2){$("#lerr").textContent=PWERR[e2.code]||("লগইন হয়নি: "+e2.code)}};
$("#lfg").onclick=async()=>{const em=$("#lem").value.trim().toLowerCase();if(!ADMINS.includes(em))return $("#lerr").textContent="আগে অ্যাডমিন Gmail লিখুন";
 try{await sendPasswordResetEmail(auth,em);$("#lerr").style.color="var(--green)";$("#lerr").textContent="পাসওয়ার্ড বদলানোর লিংক "+em+"-এ পাঠানো হয়েছে";setTimeout(()=>$("#lerr").style.color="",8000)}catch(e2){$("#lerr").textContent=PWERR[e2.code]||e2.code}};
/* Set (or change) the password for this admin Gmail; typed by the admin, never stored here. */
$("#setpw").onclick=()=>{const u=auth.currentUser;if(!u)return;const has=u.providerData.some(x=>x.providerId==="password");
 modal(`<h3 style="margin-top:0">🔑 ${has?"পাসওয়ার্ড বদলান":"পাসওয়ার্ড সেট করুন"}</h3><div class="muted" style="margin-bottom:10px">এরপর যেকোনো ফোন বা কম্পিউটার থেকে <b>${esc(u.email)}</b> আর এই পাসওয়ার্ড দিয়ে লগইন করা যাবে। কমপক্ষে ৮ অক্ষর, কাউকে বলবেন না।</div>
  <input class="inp" id="np1" type="password" autocomplete="new-password" placeholder="নতুন পাসওয়ার্ড" style="width:100%"><input class="inp" id="np2" type="password" autocomplete="new-password" placeholder="আবার লিখুন" style="width:100%;margin-top:8px">
  <div id="nperr" style="color:var(--red);margin-top:8px"></div><div class="row" style="margin-top:12px"><button class="btn o" id="npok">সেভ করুন</button><button class="btn" id="npx">বাতিল</button></div>`);
 $("#npx").onclick=closeM;
 $("#npok").onclick=async()=>{const a=$("#np1").value,b=$("#np2").value;if(a.length<8)return $("#nperr").textContent="কমপক্ষে ৮ অক্ষর দিন";if(a!==b)return $("#nperr").textContent="দুটো পাসওয়ার্ড মেলেনি";
  const doIt=()=>has?updatePassword(u,a):linkWithCredential(u,EmailAuthProvider.credential(u.email,a));
  try{await doIt()}catch(e){if(e.code==="auth/requires-recent-login"){try{await reauthenticateWithPopup(u,new GoogleAuthProvider());await doIt()}catch(e2){return $("#nperr").textContent=PWERR[e2.code]||e2.code}}else return $("#nperr").textContent=PWERR[e.code]||e.code}
  closeM();await log("admin-password",u.email,{});toast("পাসওয়ার্ড সেভ হয়েছে ✓ — এখন যেকোনো ফোন থেকে লগইন করতে পারবেন")}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 const ok=u&&ADMINS.includes((u.email||"").toLowerCase());
 if(u&&!ok){$("#lerr").textContent="এই Gmail অ্যাডমিন না: "+u.email;signOut(auth)}
 $("#login").style.display=ok?"none":"grid";$("#app").style.display=ok?"block":"none";
 if(ok){drawNav();go(current)}
});
</script>
