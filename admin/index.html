<style>
:root{--bg:#fdf6f0;--card:#fff;--mint:#e8f6f0;--mint2:#d3efe3;--ink:#24323a;--muted:#7b8a91;--line:#eadfd6;--accent:#ff7a45;--accent2:#ffe3d6;--green:#1f9d6b;--red:#e24b4b;--blue:#3b6fe0}
*{box-sizing:border-box}body{margin:0;font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--mint);border-bottom:1px solid var(--mint2);display:flex;align-items:center;gap:14px;padding:14px 22px}
.top .ham{border:0;background:none;font-size:24px;color:var(--ink)}
.top .kick{font-size:12px;letter-spacing:.25em;color:var(--accent);font-weight:700}
.top h1{margin:2px 0 0;font-size:26px;font-weight:600}
.top .sp{flex:1}.pill{background:#cdebdc;color:#1d6b4c;font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;letter-spacing:.08em}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 18px;color:var(--ink)}
.btn.o{background:var(--accent);border-color:var(--accent);color:#fff}.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.r{background:var(--red);border-color:var(--red);color:#fff}.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.drawer{position:fixed;inset:0 auto 0 0;width:270px;background:#fff;box-shadow:4px 0 24px #0002;transform:translateX(-105%);transition:.2s;z-index:20;overflow:auto;padding:16px}
.drawer.open{transform:none}.shade{position:fixed;inset:0;background:#0003;z-index:15;display:none}.shade.open{display:block}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}.brand img{width:44px;height:44px;border-radius:12px}.brand small{display:block;color:var(--accent);font-size:11px;letter-spacing:.2em;font-weight:700}.brand b{font-size:18px}
.drawer input{width:100%;padding:9px 14px;border:1px solid var(--mint2);background:#f6fbf9;border-radius:12px;margin-bottom:10px}
.sec{font-size:11px;letter-spacing:.2em;color:var(--muted);margin:16px 6px 6px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:10px 12px;border-radius:12px;color:#3b4a52;font-size:15px}
.nav:hover{background:#f5f1ec}.nav.act{background:var(--accent);color:#fff;font-weight:600;box-shadow:0 4px 12px #ff7a4555}
.nav .tag{margin-left:auto;font-size:10px;background:#fff1ea;color:var(--accent);padding:2px 6px;border-radius:6px}
main{max-width:1180px;margin:0 auto;padding:22px}
.card{background:var(--card);border:1px solid #f0e6de;border-radius:22px;padding:20px;margin-bottom:18px;box-shadow:0 2px 10px #0000000a}
.ttl{font-size:13px;letter-spacing:.2em;color:var(--blue);font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.ttl:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.stat{border:1px solid #efe5dc;border-radius:16px;padding:14px 16px;background:#fffdfb}
.stat.hl{background:var(--mint);border-color:#bfe3d2}
.stat span{font-size:13px;color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:6px;color:#7a2e12;font-weight:600}
.stat.hl b{color:#1d6b4c}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #cfe9dc;background:#f2fbf6;border-radius:999px;padding:8px 16px}.chip.act{background:var(--accent);border-color:var(--accent);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #f1e8e0;vertical-align:middle}th{color:var(--muted);font-weight:600;font-size:12px}
.tw{overflow:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp{padding:9px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:200px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:#eee}.badge.pending{background:#fff1d6;color:#a15c00}.badge.paid{background:#d9f5e7;color:#1d6b4c}.badge.rejected{background:#fde0e0;color:#b02a2a}.badge.ban{background:#fde0e0;color:#b02a2a}.badge.seller{background:#e3ecff;color:#2848a8}.badge.vip{background:linear-gradient(90deg,#ffc94d,#ff8a3d);color:#3a1a00}.badge.lv{background:linear-gradient(90deg,#5ccb9a,#1873d3);color:#fff}.badge.role{background:#efe6ff;color:#5a2bb0}
.muted{color:var(--muted)}.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#eee;vertical-align:middle}
.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(420px,92vw);text-align:center;padding:34px}
.login img{width:84px;height:84px;border-radius:20px}.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 22px;font-weight:600;margin-top:18px}
.modal{position:fixed;inset:0;background:#0005;display:none;place-items:center;z-index:30}.modal.open{display:grid}
.modal .card{width:min(520px,94vw);max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#24323a;color:#fff;padding:12px 20px;border-radius:14px;display:none;z-index:40}
.empty{padding:30px;text-align:center;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff;margin-right:8px}.lang b{padding:7px 12px;font-size:13px;cursor:pointer;font-weight:700;color:var(--muted)}.lang b.on{background:var(--accent);color:#fff}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
</style>
</head>

const ORIG=new WeakMap(),SETV=new WeakMap();
function trNode(n){
 if(n.nodeType===3){if(!/[ঀ-৿]/.test(n.nodeValue)&&!ORIG.has(n))return;if(!ORIG.has(n))ORIG.set(n,n.nodeValue);const o=ORIG.get(n);const v=LANG==="en"?T(o):o;if(n.nodeValue!==v){SETV.set(n,v);n.nodeValue=v}return}
 if(n.nodeType!==1||n.tagName==="SCRIPT"||n.tagName==="STYLE"||n.tagName==="TEXTAREA")return;
 if(n.hasAttribute("placeholder")){if(!n.dataset.ph)n.dataset.ph=n.getAttribute("placeholder");const v=LANG==="en"?T(n.dataset.ph):n.dataset.ph;if(n.getAttribute("placeholder")!==v)n.setAttribute("placeholder",v)}
 n.childNodes.forEach(trNode);
}

async function searchUsers(){const q=$("#uq").value.trim();if(!q)return;const U=collection(db,"users");
 renderUsers(await findUsers(q))}
async function findUsers(q){const U=collection(db,"users");
 if(q.includes("@"))return (await getDocs(query(U,where("email","==",q.toLowerCase())))).docs.concat((await getDocs(query(U,where("email","==",q)))).docs).filter((d,i,a)=>a.findIndex(x=>x.id===d.id)===i);
 for(const f of ["userId","vipId","playerId"]){const s=await getDocs(query(U,where(f,"==",q)));if(!s.empty)return s.docs}
 return []}
async function listUsers(q){try{const s=await getDocs(q);renderUsers(s.docs)}catch(e){$("#ulist").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
let cache={};
function renderUsers(docs){
 if(!docs.length){$("#ulist").innerHTML=`<div class="empty">কোনো ইউজার পাওয়া যায়নি</div>`;return}
 docs.forEach(d=>{cache[d.id]=d.data()});
 $("#ulist").innerHTML=`<table><tr><th>ইউজার</th><th>আইডি</th><th>লেভেল</th><th>কয়েন</th><th>ডায়মন্ড</th><th>Locked</th><th>দেশ</th><th>যোগ দিয়েছে</th><th></th></tr>${docs.map(d=>{const u=d.data();return `<tr><td>${u.photoUrl?`<img class="av" src="${esc(u.photoUrl)}">`:""} <b>${esc(u.name)}</b> ${u.banned?'<span class="badge ban">BANNED</span>':""}${u.coinSeller?' <span class="badge seller">SELLER</span>':""}${(u.roles||[]).filter(r=>r!=="coinSeller").map(r=>` <span class="badge role">${esc((ROLES.find(x=>x[0]===r)||[r,r])[1])}</span>`).join("")}<div class="muted" style="font-size:12px">${esc(u.email)}</div></td><td>${idCell(u)}</td><td><span class="badge lv">Lv ${lvl(u)}</span></td><td>${fmt(u.coins)}</td><td>${fmt(u.diamonds)}</td><td>${fmt(u.lockedDiamonds)}</td><td>${esc(u.country||"—")}</td><td>${dt(u.createdAt)}</td><td><button class="btn sm o" data-u="${d.id}">ম্যানেজ</button></td></tr>`}).join("")}</table>`;
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>manageUser(b.dataset.u));
}

 <label class="f">পরিমাণ</label><input class="inp" id="amt" type="number" min="1" placeholder="যেমন 10000" style="width:100%">
 <label class="f">কারণ (লগে থাকবে)</label><input class="inp" id="why" placeholder="যেমন: বোনাস, ভুল সংশোধন" style="width:100%">

 <div class="row" style="margin-top:14px"><button class="btn" data-a="ban">${u.banned?"আনব্যান করুন":"ব্যান করুন"}</button><button class="btn" data-a="seller">${u.coinSeller?"সেলার বাতিল":"কয়েন সেলার বানান"}</button><button class="btn" id="mclose">বন্ধ</button></div>
 <label class="f" style="margin-top:16px">পদ (একাধিক বাছাই করা যায়)</label><div class="row">${ROLES.map(([k,l])=>`<label class="chip" style="cursor:pointer"><input type="checkbox" data-role="${k}" ${(u.roles||[]).includes(k)||(k==="coinSeller"&&u.coinSeller)?"checked":""}> ${l}</label>`).join("")}</div>
 <div class="row" style="margin-top:10px"><button class="btn o" id="rsave">পদ সেভ করুন</button></div>
 <label class="f" style="margin-top:16px">লেভেল (এখন Lv ${lvl(u)} · লেভেল কয়েন ${fmt(u.levelCoins)})</label>
 <div class="row"><input class="inp" id="lvn" type="number" min="1" max="200" placeholder="নতুন লেভেল ১–২০০" style="flex:1"><button class="btn g" id="lvsave">লেভেল সেট করুন</button></div>`);
 $("#lvsave").onclick=()=>setLevel(uid);
 $("#rsave").onclick=()=>saveRoles(uid);
 $("#fullp").onclick=()=>{closeM();userProfile(uid)};
 $("#mclose").onclick=closeM;
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>userAction(uid,b.dataset.a));
}
async function userAction(uid,a){
 const u=cache[uid],n=Math.floor(Number($("#amt")?.value||0)),why=$("#why")?.value||"";
 const ref=doc(db,"users",uid);
 try{
  if(a==="ban"||a==="seller"){const f=a==="ban"?"banned":"coinSeller";const upd={[f]:!u[f]};if(a==="seller"){const r=new Set(u.roles||[]);u[f]?r.delete("coinSeller"):r.add("coinSeller");upd.roles=[...r]}const bb=writeBatch(db);bb.update(ref,upd);if(upd.roles)syncProfile(bb,uid,{roles:upd.roles});await bb.commit();await log(a,shownId(u),{to:!u[f],why});toast("সেভ হয়েছে");closeM();refresh();return}
  if(!(n>0)){toast("সঠিক পরিমাণ লিখুন");return}
  if(a==="coin-"&&n>(u.coins||0)){toast("এত কয়েন নেই");return}
  if(a==="dia-"&&n>(u.diamonds||0)){toast("এত ডায়মন্ড নেই");return}
  if(!confirm(`নিশ্চিত? ${a} ${fmt(n)} → ${u.name}`))return;
  const upd={"coin-":{coins:increment(-n)},"dia+":{diamonds:increment(n),lifetimeDiamonds:increment(n)},"dia-":{diamonds:increment(-n)}};
  await updateDoc(ref,{...(a==="coin+"?{coins:increment(n)}:upd[a]),updatedAt:serverTimestamp()});
  await log(a,shownId(u),{amount:n,why,name:u.name});toast("হয়ে গেছে ✓");closeM();refresh();
 }catch(e){toast("ব্যর্থ: "+e.message)}
}

let wtab="pending";
async function payroll(){
 view(`<div class="card"><div class="chips">${[["pending","পেন্ডিং"],["paid","পরিশোধিত"],["rejected","বাতিল"]].map(([k,l])=>`<button class="chip ${k===wtab?"act":""}" data-w="${k}">${l}</button>`).join("")}</div></div><div class="card"><div class="tw" id="wlist"><div class="empty">লোড হচ্ছে…</div></div></div>`);
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{wtab=b.dataset.w;payroll()});
 try{const s=await getDocs(query(collection(db,"withdrawals"),where("status","==",wtab),limit(200)));
  const rows=s.docs.sort((a,b)=>(b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0));
  if(!rows.length){$("#wlist").innerHTML=`<div class="empty">কোনো অর্ডার নেই</div>`;return}
  $("#wlist").innerHTML=`<table><tr><th>সময়</th><th>ইউজার</th><th>পদ্ধতি</th><th>অ্যাকাউন্ট</th><th>ডায়মন্ড</th><th>টাকা</th><th>অবস্থা</th><th></th></tr>${rows.map(d=>{const w=d.data(),x=w.details||{};return `<tr><td>${dt(w.createdAt)}</td><td><b>${esc(w.name)}</b><div class="muted" style="font-size:12px">ID ${esc(w.playerId)} · ${esc(w.country)}</div></td><td>${esc(w.method)}${x.network?` <span class="muted">(${esc(x.network)})</span>`:""}</td><td style="max-width:220px;word-break:break-all"><code>${esc(x.walletAddress||x.binanceId||"")}</code><div class="muted" style="font-size:12px">${esc((x.firstName||"")+" "+(x.lastName||""))}</div></td><td>${fmt(w.diamonds)}</td><td><b>$${Number(w.usd||0).toFixed(2)}</b></td><td><span class="badge ${esc(w.status)}">${esc(w.status).toUpperCase()}</span></td><td>${w.status==="pending"?`<button class="btn sm g" data-p="${d.id}">Paid</button> <button class="btn sm r" data-x="${d.id}">বাতিল</button>`:""}</td></tr>`}).join("")}</table>`;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>settle(b.dataset.p,true,rows));
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>settle(b.dataset.x,false,rows));
 }catch(e){$("#wlist").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
async function settle(id,paid,rows){
 const w=rows.find(r=>r.id===id).data();
 if(!confirm(paid?`$${Number(w.usd).toFixed(2)} পাঠিয়েছেন? Paid করবেন?`:`অর্ডার বাতিল করবেন? ${fmt(w.diamonds)} ডায়মন্ড ইউজারকে ফেরত যাবে।`))return;
 try{const b=writeBatch(db);
  b.update(doc(db,"withdrawals",id),{status:paid?"paid":"rejected",settledAt:serverTimestamp(),settledBy:auth.currentUser.email});
  b.update(doc(db,"users",w.uid),paid?{lockedDiamonds:increment(-w.diamonds)}:{lockedDiamonds:increment(-w.diamonds),diamonds:increment(w.diamonds)});
  await b.commit();await log(paid?"withdraw-paid":"withdraw-rejected",w.playerId,{usd:w.usd,diamonds:w.diamonds});toast("আপডেট হয়েছে ✓");payroll();
 }catch(e){toast("ব্যর্থ: "+e.message)}
}

const DEF_PACKS=[[10000,500,"1.99"],[20000,1000,"3.99"],[50000,3000,"9.99"],[70000,4200,"13.99"],[100000,7000,"19.99"],[200000,16000,"40.99"],[300000,27000,"60.99"],[500000,50000,"101.99"],[1000000,120000,"205.99"],[1500000,210000,"312.99"]];

 const rowH=(p,i)=>`<tr><td>${i+1}</td><td><input class="inp" style="min-width:110px" data-f="coins" value="${p.coins}"></td><td><input class="inp" style="min-width:90px" data-f="bonus" value="${p.bonus}"></td><td><input class="inp" style="min-width:90px" data-f="price" value="${esc(p.price)}"></td><td class="muted">${fmt(Number(p.coins)+Number(p.bonus))}</td><td><button class="btn sm r" data-del="${i}">✕</button></td></tr>`;

}

 if(!confirm(`${u.name}-এর লেভেল Lv ${lvl(u)} থেকে Lv ${n} করবেন?`))return;
 try{const b=writeBatch(db);b.update(doc(db,"users",uid),{level:n,updatedAt:serverTimestamp()});syncProfile(b,uid,{level:n});await b.commit();

 <div class="row" style="margin-top:12px"><input class="inp" id="uq" placeholder="প্লেয়ার আইডি বা Gmail লিখুন" style="flex:1"><button class="btn o" id="ugo">খুঁজুন</button></div></div>

 $("#ugo").onclick=searchUsers;$("#uq").onkeydown=e=>{if(e.key==="Enter")searchUsers()};

// ---------- VIP IDs ----------
async function vip(){
 view(`<div class="card"><div class="ttl">VIP IDS</div><div class="muted">৫০টি বিশেষ আইডি। সাধারণ ইউজার এগুলো পায় না। মেয়াদ থাকা পর্যন্ত ইউজারের সব জায়গায় VIP আইডি দেখাবে, মেয়াদ শেষে আসল আইডি ফিরে আসবে।</div>
 <div class="chips" style="margin-top:12px" id="vf">${[["all","সব"],["free","খালি"],["used","ব্যবহারে"]].map(([k,l],i)=>`<button class="chip ${i===0?"act":""}" data-f="${k}">${l}</button>`).join("")}</div></div>
 <div class="card"><div class="tw" id="vlist"><div class="empty">লোড হচ্ছে…</div></div></div>`);
 let rows=[];
 try{
  const s=await getDocs(query(collection(db,"ids"),where("type","==","vip")));
  const have=new Map(s.docs.map(d=>[d.id,d.data()]));
  const miss=VIPS.filter(v=>!have.has(v));
  if(miss.length){const b=writeBatch(db);miss.forEach(v=>{b.set(doc(db,"ids",v),{type:"vip",uid:null,until:null,at:serverTimestamp()});have.set(v,{type:"vip",uid:null})});await b.commit()}
  const uids=[...new Set([...have.values()].map(x=>x.uid).filter(Boolean))];
  const users={};await Promise.all(uids.map(async u=>{const d=await getDoc(doc(db,"users",u));if(d.exists())users[u]=d.data()}));
  rows=VIPS.map(v=>{const x=have.get(v)||{};const u=x.uid?users[x.uid]:null;const active=!!(u&&u.vipId===v&&vipOn(u));return {v,x,u,active}});
 }catch(e){$("#vlist").innerHTML=`<div class="empty">${esc(e.message)}</div>`;return}
 const draw=f=>{const r=rows.filter(o=>f==="all"||(f==="free"?!o.active:o.active));
  $("#vlist").innerHTML=`<table><tr><th>VIP আইডি</th><th>অবস্থা</th><th>ইউজার</th><th>মেয়াদ শেষ</th><th></th></tr>${r.map(o=>`<tr><td><b style="font-size:16px">${o.v}</b></td><td>${o.active?'<span class="badge paid">ব্যবহারে</span>':'<span class="badge">খালি</span>'}</td><td>${o.active?`<b>${esc(o.u.name)}</b><div class="muted" style="font-size:12px">আসল ${esc(ownId(o.u))} · ${esc(o.u.email)}</div>`:"—"}</td><td>${o.active?day(o.u.vipUntil):"—"}</td><td>${o.active?`<button class="btn sm g" data-ext="${o.v}">মেয়াদ বাড়ান</button> <button class="btn sm r" data-rev="${o.v}">ফিরিয়ে নিন</button>`:`<button class="btn sm o" data-give="${o.v}">দিন</button>`}</td></tr>`).join("")}</table>`;
  document.querySelectorAll("[data-give]").forEach(b=>b.onclick=()=>vipGive(b.dataset.give,rows));
  document.querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>vipExtend(rows.find(o=>o.v===b.dataset.ext)));
  document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>vipRevoke(rows.find(o=>o.v===b.dataset.rev)));
 };
 document.querySelectorAll("#vf [data-f]").forEach(b=>b.onclick=()=>{document.querySelectorAll("#vf .chip").forEach(c=>c.classList.remove("act"));b.classList.add("act");draw(b.dataset.f)});
 draw("all");
}
const durPick=()=>`<label class="f">মেয়াদ</label><div class="chips" id="dur">${DUR.map(([k,l],i)=>`<button class="chip ${i===0?"act":""}" data-m="${DUR[i][2]}">${l}</button>`).join("")}</div>`;
const bindDur=()=>{let m=3;document.querySelectorAll("#dur .chip").forEach(b=>b.onclick=()=>{document.querySelectorAll("#dur .chip").forEach(c=>c.classList.remove("act"));b.classList.add("act");m=+b.dataset.m});return()=>m};
function vipGive(v){
 modal(`<h3 style="margin-top:0">VIP আইডি ${v} দিন</h3><label class="f">ইউজারের আইডি বা Gmail</label><input class="inp" id="vq" style="width:100%">${durPick()}
 <div class="row" style="margin-top:16px"><button class="btn o" id="vok">দিন</button><button class="btn" id="mclose">বন্ধ</button></div>`);
 $("#mclose").onclick=closeM;const getM=bindDur();
 $("#vok").onclick=async()=>{const q=$("#vq").value.trim();if(!q){toast("ইউজারের আইডি বা Gmail");return}
  try{const hits=await findUsers(q);if(hits.length!==1){toast("কোনো ইউজার পাওয়া যায়নি");return}
   const d=hits[0],u=d.data(),m=getM();
   const cur=await getDoc(doc(db,"ids",v));const cx=cur.data()||{};
   if(cx.uid&&cx.uid!==d.id){const o=await getDoc(doc(db,"users",cx.uid));if(o.exists()&&o.data().vipId===v&&vipOn(o.data())){toast("এই VIP আইডি এখন অন্য কেউ ব্যবহার করছে");return}}
   const until=addMonths(new Date(),m);
   if(!confirm(`${u.name} (আসল ${ownId(u)}) কে ${v} দেবেন? মেয়াদ: ${day(until)}`))return;
   const b=writeBatch(db);
   if(vipOn(u)&&u.vipId!==v)b.set(doc(db,"ids",u.vipId),{type:"vip",uid:null,until:null},{merge:true});
   if(cx.uid&&cx.uid!==d.id){b.update(doc(db,"users",cx.uid),{vipId:"",vipUntil:null});syncProfile(b,cx.uid,{vipId:"",vipUntil:null})}
   syncProfile(b,d.id,{vipId:v,vipUntil:Timestamp.fromDate(until)});
   b.set(doc(db,"ids",v),{type:"vip",uid:d.id,until:Timestamp.fromDate(until),at:serverTimestamp()},{merge:true});
   b.update(doc(db,"users",d.id),{vipId:v,vipUntil:Timestamp.fromDate(until),updatedAt:serverTimestamp()});
   await b.commit();await log("vip-give",v,{to:ownId(u),name:u.name,months:m});toast("হয়ে গেছে ✓");closeM();vip();
  }catch(e){toast("ব্যর্থ: "+e.message)}};
}
function vipExtend(o){
 modal(`<h3 style="margin-top:0">${o.v} — মেয়াদ বাড়ান</h3><div class="muted">${esc(o.u.name)} · এখন শেষ হবে ${day(o.u.vipUntil)}</div>${durPick()}
 <div class="row" style="margin-top:16px"><button class="btn g" id="vok">বাড়ান</button><button class="btn" id="mclose">বন্ধ</button></div>`);
 $("#mclose").onclick=closeM;const getM=bindDur();
 $("#vok").onclick=async()=>{const m=getM();const base=Math.max(Date.now(),o.u.vipUntil.toMillis());const until=addMonths(new Date(base),m);
  try{const b=writeBatch(db);b.update(doc(db,"users",o.x.uid),{vipUntil:Timestamp.fromDate(until)});syncProfile(b,o.x.uid,{vipUntil:Timestamp.fromDate(until)});b.set(doc(db,"ids",o.v),{until:Timestamp.fromDate(until)},{merge:true});await b.commit();
   await log("vip-extend",o.v,{name:o.u.name,months:m});toast("হয়ে গেছে ✓");closeM();vip()}catch(e){toast("ব্যর্থ: "+e.message)}};
}
async function vipRevoke(o){
 if(!confirm(`${o.v} ${o.u.name}-এর কাছ থেকে ফিরিয়ে নেবেন? তার আসল আইডি ${ownId(o.u)} আবার দেখাবে।`))return;
 try{const b=writeBatch(db);b.update(doc(db,"users",o.x.uid),{vipId:"",vipUntil:null});syncProfile(b,o.x.uid,{vipId:"",vipUntil:null});b.set(doc(db,"ids",o.v),{uid:null,until:null},{merge:true});await b.commit();
  await log("vip-revoke",o.v,{name:o.u.name});toast("হয়ে গেছে ✓");vip()}catch(e){toast("ব্যর্থ: "+e.message)}
}

async function userProfile(uid){

 const [a,b]=chatId.split("_");leftUid=leftUid||a;const rightUid=leftUid===a?b:a;
 modal(`<div class="empty">লোড হচ্ছে…</div>`);
 try{const [pl,pr,ms]=await Promise.all([prof(leftUid),prof(rightUid),getDocs(query(collection(db,"chats",chatId,"messages"),orderBy("at","desc"),limit(500)))]);
  const list=ms.docs.map(d=>d.data()).reverse();
  const body=m=>m.type==="image"&&m.data?`<img src="data:image/jpeg;base64,${m.data}" style="max-width:220px;border-radius:10px;cursor:zoom-in" data-zoom>`:(m.type==="voice"&&m.data?`<audio controls preload="none" src="data:audio/mp4;base64,${m.data}" style="max-width:240px"></audio> <span class="muted" style="font-size:11px">${m.dur||""}s</span>`:esc(m.text));
  $("#mbody").innerHTML=`<div class="row" style="align-items:center;margin-bottom:10px"><div style="flex:1"><b>${esc(pl.name||"—")}</b> ↔ <b>${esc(pr.name||"—")}</b><div class="muted" style="font-size:12px">মোট ${list.length} মেসেজ (শেষ ৫০০টি)</div></div><button class="btn" id="mclose">বন্ধ</button></div>
   <div style="max-height:65vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px">${list.map(m=>{const mine=m.from===rightUid;return `<div style="align-self:${mine?"flex-end":"flex-start"};max-width:80%;background:${mine?"#6c3bff":"#33197a"};color:#fff;padding:8px 11px;border-radius:14px">
    <div style="font-size:11px;opacity:.7;margin-bottom:3px">${esc((mine?pr:pl).name||"")} · ${dt(m.at)}</div>${body(m)}
    ${m.deletedForAll?'<div style="margin-top:4px"><span class="badge ban">সবার জন্য মুছে ফেলা হয়েছে</span></div>':""}${(m.deletedFor||[]).length?'<div style="margin-top:4px"><span class="badge">নিজের জন্য মুছেছে</span></div>':""}</div>`}).join("")||'<div class="empty">কোনো মেসেজ নেই</div>'}</div>`;
  $("#mclose").onclick=closeM;document.querySelectorAll("[data-zoom]").forEach(i=>i.onclick=()=>window.open().document.write(`<img src="${i.src}" style="max-width:100%">`));
 }catch(e){$("#mbody").innerHTML=`<div class="empty">${esc(e.message)}</div><button class="btn" onclick="document.getElementById('modal').classList.remove('open')">বন্ধ</button>`}
}

// ---------- Reports ----------
let rtab="open";
async function reports(){
 view(`<div class="card"><div class="chips">${[["open","নতুন"],["resolved","সমাধান হয়েছে"],["dismissed","বাতিল"]].map(([k,l])=>`<button class="chip ${k===rtab?"act":""}" data-t="${k}">${l}</button>`).join("")}<button class="chip" id="rf">⟳ রিফ্রেশ</button></div></div><div class="card"><div class="tw" id="rlist"><div class="empty">লোড হচ্ছে…</div></div></div>`);
 document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{rtab=b.dataset.t;reports()});$("#rf").onclick=reports;
 const RS={"Abuse in party room comments":"পার্টি রুমে কমেন্টে গালাগালি","Abuse in inbox":"ইনবক্সে গালাগালি","Bad or obscene name":"খারাপ / অশ্লীল নাম","Bad or obscene photo":"খারাপ / অশ্লীল ছবি","Fraud":"প্রতারণা","Other":"অন্যান্য"};
 try{const s=await getDocs(query(collection(db,"reports"),where("status","==",rtab),limit(300)));
  const rows=s.docs.sort((a,b)=>(b.data().at?.seconds||0)-(a.data().at?.seconds||0));
  if(!rows.length){$("#rlist").innerHTML=`<div class="empty">কোনো রিপোর্ট নেই</div>`;return}
  $("#rlist").innerHTML=`<table><tr><th>সময়</th><th>যে রিপোর্ট করেছে</th><th>যার বিরুদ্ধে</th><th>কারণ</th><th>স্ক্রিনশট</th><th></th></tr>${rows.map(d=>{const r=d.data();return `<tr><td>${dt(r.at)}</td>
   <td><b>${esc(r.fromName)}</b><div class="muted" style="font-size:12px">ID ${esc(r.fromId)}</div></td>
   <td><b>${esc(r.targetName)}</b><div class="muted" style="font-size:12px">ID ${esc(r.targetId)}</div></td>
   <td style="max-width:240px"><b>${esc(RS[r.reason]||r.reason)}</b>${r.details?`<div class="muted" style="font-size:12px">${esc(r.details)}</div>`:""}${r.note?`<div style="font-size:12px;color:var(--accent)">নোট: ${esc(r.note)}</div>`:""}</td>
   <td>${(r.images||[]).map(im=>`<img data-zoomr src="data:image/jpeg;base64,${im}" style="width:54px;height:54px;object-fit:cover;border-radius:8px;cursor:zoom-in;margin:2px">`).join("")||"—"}</td>
   <td style="white-space:nowrap"><button class="btn sm" data-up="${r.target}">প্রোফাইল</button> <button class="btn sm" data-ch="${r.chatId||""}" data-who="${r.target}">চ্যাট</button>${r.status==="open"?` <button class="btn sm g" data-res="${d.id}">সমাধান</button> <button class="btn sm r" data-dis="${d.id}">বাতিল</button>`:""}</td></tr>`}).join("")}</table>`;
  document.querySelectorAll("[data-zoomr]").forEach(i=>i.onclick=()=>lightbox(i.src));
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>userProfile(b.dataset.up));
  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{if(b.dataset.ch)openChat(b.dataset.ch,b.dataset.who);else toast("চ্যাট নেই")});
  const decide=async(id,st)=>{const r=rows.find(x=>x.id===id).data();const note=prompt(st==="resolved"?"কী ব্যবস্থা নিলেন? (ঐচ্ছিক)":"বাতিলের কারণ (ঐচ্ছিক)","");if(note===null)return;
   try{const b=writeBatch(db);b.update(doc(db,"reports",id),{status:st,note,decidedAt:serverTimestamp(),decidedBy:auth.currentUser.email});
    b.set(doc(collection(db,"users",r.from,"inbox")),{title:"Report reviewed",body:st==="resolved"?`Thank you. We reviewed your report about ${r.targetName} (ID ${r.targetId}) and took action.`:`We reviewed your report about ${r.targetName} (ID ${r.targetId}) and found no rule break.`,kind:"report",at:serverTimestamp()});
    await b.commit();await log("report-"+st,r.targetId,{reason:r.reason,note});toast("হয়ে গেছে ✓");reports()}catch(e){toast("ব্যর্থ: "+e.message)}};
  document.querySelectorAll("[data-res]").forEach(b=>b.onclick=()=>decide(b.dataset.res,"resolved"));
  document.querySelectorAll("[data-dis]").forEach(b=>b.onclick=()=>decide(b.dataset.dis,"dismissed"));
 }catch(e){$("#rlist").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

async function games(){
 view(`<div class="card"><div class="ttl">অনলাইন গেম — আয়ের হিসাব (বাংলাদেশ সময়)</div><div class="tw" id="gstat"><div class="empty">লোড হচ্ছে…</div></div></div>
  <div class="card"><div class="ttl">সাম্প্রতিক ম্যাচ</div><div class="tw" id="gmat"><div class="empty">লোড হচ্ছে…</div></div></div>
  <div class="card" style="max-width:640px"><div class="ttl">গেম সেটিং</div><div class="muted">এখানে বদলালে ৩০ সেকেন্ডের মধ্যে সার্ভারে কার্যকর হবে।</div>
  <label style="display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:800"><input type="checkbox" id="gon" style="width:22px;height:22px"> অনলাইন গেম চালু</label>
  <label class="f">ম্যাচ ফি (%)</label><input class="inp" id="gfee" type="number" min="0" max="30">
  <label class="f">৪ জনের খেলায় ভাগ (১ম % , ২য় %)</label><div style="display:flex;gap:8px"><input class="inp" id="gs1" type="number"><input class="inp" id="gs2" type="number"></div>
  <label class="f">কম্পিউটারের সাথে জিতলে গুণ (Easy / Normal / Hard)</label><div style="display:flex;gap:8px"><input class="inp" id="gbe" type="number" step="0.1"><input class="inp" id="gbn" type="number" step="0.1"><input class="inp" id="gbh" type="number" step="0.1"></div>
  <label class="f">বাজির টেবিল (কমা দিয়ে)</label><input class="inp" id="gst" style="width:100%">
  <button class="btn o" id="gsv" style="margin-top:14px">সেভ করুন</button></div>`);
 const D={enabled:true,feePct:5,split4:[70,30],botMult:{easy:1.4,normal:1.6,hard:2.0},stakes:[500,1000,5000,10000,50000,100000,500000,1000000]};
 let c=D;try{const g=(await getDoc(doc(db,"config","games"))).data()||{};c={...D,...g,botMult:{...D.botMult,...(g.botMult||{})}}}catch(e){}
 $("#gon").checked=c.enabled!==false;$("#gfee").value=c.feePct;$("#gs1").value=c.split4[0];$("#gs2").value=c.split4[1];
 $("#gbe").value=c.botMult.easy;$("#gbn").value=c.botMult.normal;$("#gbh").value=c.botMult.hard;$("#gst").value=c.stakes.join(", ");
 $("#gsv").onclick=async()=>{const n=x=>Number($(x).value);
  const v={enabled:$("#gon").checked,feePct:n("#gfee"),split4:[n("#gs1"),n("#gs2")],botMult:{easy:n("#gbe"),normal:n("#gbn"),hard:n("#gbh")},stakes:$("#gst").value.split(",").map(x=>parseInt(x.trim())).filter(x=>x>0)};
  if(v.split4[0]+v.split4[1]!==100)return toast("৪ জনের ভাগ মিলে ১০০ হতে হবে");
  if(!(v.feePct>=0&&v.feePct<=30))return toast("ফি ০–৩০% এর মধ্যে দিন");
  if(!confirm("গেম সেটিং সেভ করবেন?"))return;
  try{await setDoc(doc(db,"config","games"),v,{merge:true});await log("game-settings","config",v);toast("সেভ হয়েছে ✓")}catch(e){toast("ব্যর্থ: "+e.message)}};
 const nf=x=>(x||0).toLocaleString("en-US");
 try{const s=await getDocs(query(collection(db,"gameStats"),orderBy("day","desc"),limit(31)));
  if(!s.size){$("#gstat").innerHTML=`<div class="empty">এখনো কোনো ম্যাচ হয়নি</div>`}else{
  let tot={m:0,f:0,b:0,i:0};const rows=s.docs.map(d=>{const g=d.data();tot.m+=g.matches||0;tot.f+=g.fees||0;tot.b+=g.botIncome||0;tot.i+=g.income||0;
   const st=Object.entries(g.byStake||{}).sort((a,b)=>a[0]-b[0]).map(([k,v])=>`${nf(+k)}: ${nf(v.income)} (${v.matches})`).join("<br>");
   const md=Object.entries(g.byMode||{}).map(([k,v])=>`${k}: ${nf(v.income)} (${v.matches})`).join("<br>");
   return `<tr><td><b>${g.day}</b></td><td>${nf(g.matches)}</td><td>${nf(g.fees)}</td><td>${nf(g.botIncome)}</td><td><b>${nf(g.income)}</b></td><td style="font-size:12px">${st}</td><td style="font-size:12px">${md}</td></tr>`}).join("");
  $("#gstat").innerHTML=`<table><tr><th>দিন</th><th>ম্যাচ</th><th>ম্যাচ ফি আয়</th><th>কম্পিউটার খেলা আয়</th><th>মোট আয় (কয়েন)</th><th>টেবিল অনুযায়ী</th><th>ধরন অনুযায়ী</th></tr>${rows}<tr style="background:var(--mint)"><td><b>মোট</b></td><td>${nf(tot.m)}</td><td>${nf(tot.f)}</td><td>${nf(tot.b)}</td><td><b>${nf(tot.i)}</b></td><td></td><td></td></tr></table>`}
 }catch(e){$("#gstat").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
 try{const s=await getDocs(query(collection(db,"matches"),orderBy("at","desc"),limit(50)));
  $("#gmat").innerHTML=s.size?`<table><tr><th>সময়</th><th>ধরন</th><th>টেবিল</th><th>খেলোয়াড়</th><th>পেয়েছে</th><th>আয়</th></tr>${s.docs.map(d=>{const m=d.data();return `<tr><td>${dt(m.at)}</td><td>${esc(m.mode)}</td><td>${nf(m.stake)}</td><td style="font-size:12px">${(m.players||[]).map(p=>`<span data-up="${p.startsWith("bot")?"":p}" style="cursor:pointer;text-decoration:underline">${esc(p.slice(0,8))}</span>`).join(", ")}</td><td style="font-size:12px">${(m.credits||[]).map(c=>`${esc(c.uid.slice(0,8))}: ${nf(c.amount)}`).join("<br>")}</td><td><b>${nf(m.income)}</b></td></tr>`}).join("")}</table>`:`<div class="empty">এখনো কোনো ম্যাচ হয়নি</div>`;
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>b.dataset.up&&userProfile(b.dataset.up));
 }catch(e){$("#gmat").innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}

function soon(){view(`<div class="card empty" style="padding:60px">🚧 এই সেকশন অনলাইন আপডেটের (ভয়েস রুম, গিফট, অনলাইন গেম) সাথে চালু হবে।</div>`)}
const PAGES={dash,users,banned,payroll,sellers,packages,wallet,topup,logs,message,vip,roles,apps,deposits,depset,chats,reports,games};

// ---------- Auth ----------
$("#gin").onclick=async()=>{$("#lerr").textContent="";try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("#lerr").textContent="লগইন হয়নি: "+e.code}};
$("#out").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{
 const ok=u&&ADMINS.includes((u.email||"").toLowerCase());
 if(u&&!ok){$("#lerr").textContent="এই Gmail অ্যাডমিন না: "+u.email;signOut(auth)}
 $("#login").style.display=ok?"none":"grid";$("#app").style.display=ok?"block":"none";
 if(ok){drawNav();go(current)}
});
</script>
